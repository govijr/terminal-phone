name: Release
# Pushing a vX.Y.Z tag tests, builds and publishes a GitHub release. Binaries are ad-hoc signed and built
# from this public source; users download with curl (no quarantine flag), so no Apple signing is needed.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check the tag matches the CLI version
        run: |
          grep -q "productVersion = \"${GITHUB_REF_NAME#v}\"" Sources/TerminalPhoneCore/*.swift \
            || { echo "Tag $GITHUB_REF_NAME doesn't match PhoneAgentAPI.productVersion"; exit 1; }
          grep -q "releases/download/$GITHUB_REF_NAME" README.md \
            || { echo "README download commands don't point at $GITHUB_REF_NAME"; exit 1; }
          for manifest in plugins/terminal-phone/.claude-plugin/plugin.json .claude-plugin/marketplace.json; do
            grep -q "\"version\": \"${GITHUB_REF_NAME#v}\"" "$manifest" \
              || { echo "$manifest doesn't have version ${GITHUB_REF_NAME#v}"; exit 1; }
          done
      - name: Test
        run: swift test
      - name: Build and package
        run: bash scripts/release-phone.sh
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "terminal-phone ${GITHUB_REF_NAME#v}" --generate-notes \
            dist/releases/terminal-phone-*-macos-arm64.tar.gz dist/releases/terminal-phone-*-macos-arm64.tar.gz.sha256
