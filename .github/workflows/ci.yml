name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build
        run: swift build --product terminal-phone
      - name: Test
        run: swift test
      - name: Package (local, ad-hoc signed)
        run: bash scripts/release-phone.sh
