name: Release
# Pushing a vX.Y.Z tag tests, builds and publishes a GitHub release. Binaries are ad-hoc signed and built
# from this public source; users install with Homebrew (source build) or curl, so no Apple signing is needed.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check the tag matches the CLI version
        run: |
          grep -q "productVersion = \"${GITHUB_REF_NAME#v}\"" Sources/TerminalPhoneCore/*.swift \
            || { echo "Tag $GITHUB_REF_NAME doesn't match PhoneAgentAPI.productVersion"; exit 1; }
      - name: Test
        run: swift test
      - name: Build and package
        run: bash scripts/release-phone.sh
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "terminal-phone ${GITHUB_REF_NAME#v}" --generate-notes \
            dist/releases/terminal-phone-*-macos-arm64.tar.gz dist/releases/terminal-phone-*-macos-arm64.tar.gz.sha256
          sha="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz" | shasum -a 256 | awk '{print $1}')"
          echo "Homebrew formula: url https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$GITHUB_REF_NAME.tar.gz  sha256 $sha" >> "$GITHUB_STEP_SUMMARY"
